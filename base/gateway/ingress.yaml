# gateway Ingress → ALB (AWS Load Balancer Controller, 3.1.2 Terraform 설치)
#   CloudFront /api/* 원본. CloudFront(envs/staging cloudfront.tf)는 ALB 태그 ingress.k8s.aws/stack=cinema-staging/gateway로
#   이 ALB를 찾는다 → Ingress 이름·namespace를 바꾸면 CloudFront가 원본을 못 찾는다
#   보안그룹: Terraform이 만든 cinema-staging-alb(이름으로 지정 — Public 레포라 ID를 쓰지 않는다). CloudFront 접두사 목록에서만 80 허용,
#   노드 SG의 ALB → 8080 규칙도 Terraform(3.1.2)이 이미 넣었다 → 컨트롤러가 규칙을 만들지 않게 manage-backend…=false
#   SSE(런타임 계약 6장 ②): 유휴 120초, 내려가는 파드 정리 30초(terminationGracePeriodSeconds 35보다 짧게)
#   HTTPS 원본(3.1.23 후속, SeatSAC 런북 7-8): CloudFront → ALB 443. 인증서는 ARN을 쓰지 않고(Public 레포 — 계정 ID 금지)
#   spec.tls.hosts 이름으로 LB Controller가 ACM(ap-northeast-2)에서 찾는다. 인증서·origin. DNS·SG 443은 SeatSAC Terraform
#   (envs/staging origin_https.tf, api_origin_https = "prepare") → 그 apply 뒤에만 이 변경을 머지한다(인증서가 없으면 조정 실패).
#   80 리스너는 CloudFront 전환을 확인한 뒤 따로 지운다. rules에는 host를 두지 않는다(CloudFront가 뷰어 Host를 그대로 넘긴다)
#   블루/그린: ALB는 active Service gateway의 엔드포인트(파드 IP)로 보낸다. Rollout이 전환하면 대상이 바뀐다
#   🆕 /ops → ops-api (6.1.7, SeatSAC ADR-119): CloudFront /ops/* → 이 ALB → ops-api:8080. gateway를 거치지 않는다
#     (gateway를 정지해도 관리자 화면이 동작해야 해서). IngressGroup으로 묶지 않고 이 Ingress에 경로를 더한다 —
#     묶으면 LB Controller 스택이 바뀌어 ALB가 새로 만들어지고 CloudFront 원본·origin. DNS가 바뀐다.
#     경로는 위에서부터 규칙 순서다: /ops가 / 보다 먼저. ops-api Service가 없으면 컨트롤러가 이 Ingress 전체를 조정하지 못하므로
#     ops-api(base/ops-api, Application cinema-ops-api)가 Synced·Healthy가 된 뒤에 머지한다. 헬스 체크 경로는 같다(/actuator/health/readiness)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gateway
  labels:
    app.kubernetes.io/name: gateway
    app.kubernetes.io/part-of: cinema
  annotations:
    alb.ingress.kubernetes.io/load-balancer-name: cinema-staging-gateway
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS": 443}]'
    alb.ingress.kubernetes.io/ssl-policy: ELBSecurityPolicy-TLS13-1-2-2021-06
    alb.ingress.kubernetes.io/security-groups: cinema-staging-alb
    alb.ingress.kubernetes.io/manage-backend-security-group-rules: "false"
    alb.ingress.kubernetes.io/healthcheck-path: /actuator/health/readiness
    alb.ingress.kubernetes.io/healthcheck-port: traffic-port
    alb.ingress.kubernetes.io/success-codes: "200"
    alb.ingress.kubernetes.io/healthcheck-interval-seconds: "10"
    alb.ingress.kubernetes.io/healthy-threshold-count: "2"
    alb.ingress.kubernetes.io/unhealthy-threshold-count: "2"
    alb.ingress.kubernetes.io/load-balancer-attributes: idle_timeout.timeout_seconds=120
    alb.ingress.kubernetes.io/target-group-attributes: deregistration_delay.timeout_seconds=30
    alb.ingress.kubernetes.io/tags: Project=cinema,Env=staging,ManagedBy=aws-load-balancer-controller
spec:
  ingressClassName: alb
  tls:
    - hosts:
        - origin.seatsac.com
  rules:
    - http:
        paths:
          - path: /ops
            pathType: Prefix
            backend:
              service:
                name: ops-api
                port: { name: http }
          - path: /
            pathType: Prefix
            backend:
              service:
                name: gateway
                port: { name: http }
