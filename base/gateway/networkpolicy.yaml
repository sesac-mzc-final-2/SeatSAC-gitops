# gateway 인바운드 허용 (docs/service-runtime-contract.md 6장, 3.1.13). egress는 막지 않는다
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: gateway-ingress
  labels:
    app.kubernetes.io/name: gateway
    app.kubernetes.io/part-of: cinema
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/name: gateway }
  policyTypes: [Ingress]
  ingress:
    - from:                                   # ALB(target-type ip) — VPC CIDR
        - ipBlock: { cidr: 10.20.0.0/16 }
      ports: [{ port: 8080, protocol: TCP }]
    - from:                                   # 블루/그린 분석 트래픽 Job (analysis/, 3.1.6) → gateway-preview
        - podSelector: { matchLabels: { app.kubernetes.io/name: rollout-smoke } }
      ports: [{ port: 8080, protocol: TCP }]
    - from:                                   # Prometheus 수집
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: monitoring } }
      ports: [{ port: 8080, protocol: TCP }]
