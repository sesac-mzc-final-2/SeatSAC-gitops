# ops-api ServiceAccount — 두 가지 권한
#   1) Kubernetes API(상태 읽기·scale): rbac.yaml의 Role·ClusterRole → 토큰을 마운트한다(automount true)
#   2) AWS(리포트 Athena·S3): Pod Identity cinema-staging-ops-api-pod (SeatSAC Terraform envs/staging/ops_api.tf — namespace·이름이 같아야 한다)
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ops-api
  labels:
    app.kubernetes.io/name: ops-api
    app.kubernetes.io/part-of: cinema
automountServiceAccountToken: true
