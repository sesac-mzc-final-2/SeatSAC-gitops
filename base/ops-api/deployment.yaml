# ops-api — 롤링 (maxUnavailable 0, maxSurge 1), replicas 1 고정 (런타임 계약 2장 🆕 ops-api 행)
#   리포트 결과 캐시(1시간)가 프로세스 메모리라 워커·파드 1개. 다른 서비스를 정지해도 이 파드는 그대로다(정지 대상 아님)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ops-api
  labels:
    app.kubernetes.io/name: ops-api
    app.kubernetes.io/part-of: cinema
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels: { app.kubernetes.io/name: ops-api }
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ops-api
        app.kubernetes.io/part-of: cinema
    spec:
      serviceAccountName: ops-api
      terminationGracePeriodSeconds: 35
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: ops-api                          # SeatSAC np-check.sh가 컨테이너 이름 = 서비스 이름으로 exec 한다
          image: cinema/ops-api                  # overlay image-tag가 태그를, ArgoCD Application이 레지스트리를 붙인다
          ports:
            - { name: http, containerPort: 8080 }
          envFrom:
            - configMapRef: { name: cinema-infra-endpoints }   # Terraform — COGNITO_*·PROMETHEUS_URL·REPORTS_BUCKET·ATHENA_WORKGROUP (이름 그대로 읽는다)
            - configMapRef: { name: ops-api-config }
          startupProbe:
            httpGet: { path: /actuator/health/readiness, port: http }
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: http }   # 외부 의존 없음(gateway와 같은 readinessState만) — ALB 대상 그룹 헬스 체크도 이 경로
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: http }
            periodSeconds: 10
            failureThreshold: 3
          lifecycle:
            preStop:
              exec: { command: ["sleep", "5"] }
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 384Mi }                 # cpu limit 없음
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: tmp
          emptyDir: { sizeLimit: 64Mi }
