# 🆕 ops-api (Python FastAPI, 6.1.7, ADR-119). 런타임 계약 10장
#   관리자 API /ops/** — CloudFront /ops/* → 같은 ALB의 /ops 규칙(base/gateway/ingress.yaml에 경로) → ops-api:8080
#   다른 서비스와 다른 점: Kubernetes API를 부른다(ServiceAccount 토큰·Role) · Flyway Job·HPA 없음 · replicas 1
#   Application cinema-ops-api는 SeatSAC Terraform(envs/staging-k8s/argocd_apps.tf, ops_api_enabled)이 만든다 — 이 레포에는 없다
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - serviceaccount.yaml
  - rbac.yaml
  - state-configmap.yaml
  - deployment.yaml
  - service.yaml
  - networkpolicy.yaml
  - podmonitor.yaml
