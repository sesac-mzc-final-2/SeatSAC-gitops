# booking ServiceAccount — Pod Identity로 AWS 권한을 받는다 (3.1.9, ADR-69)
#   SeatSAC Terraform envs/staging/sqs.tf의 Pod Identity 연결(namespace cinema-staging · 이름 booking)과 이름이 같아야 한다
#   역할 cinema-staging-booking-pod: 알림 큐 SendMessage·GetQueueUrl만 (런타임 계약 2장). 액세스 키 없음
#   쿠버네티스 API 토큰은 쓰지 않는다(automount 끔). Pod Identity 토큰은 웹훅이 따로 projected 볼륨으로 붙인다
apiVersion: v1
kind: ServiceAccount
metadata:
  name: booking
  labels:
    app.kubernetes.io/name: booking
    app.kubernetes.io/part-of: cinema
automountServiceAccountToken: false
