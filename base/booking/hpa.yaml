apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: booking
  labels:
    app.kubernetes.io/name: booking
    app.kubernetes.io/part-of: cinema
spec:
  scaleTargetRef:
    apiVersion: argoproj.io/v1alpha1
    kind: Rollout
    name: booking
  minReplicas: 1
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 70 }
