apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: booking
  labels:
    app.kubernetes.io/name: booking
    app.kubernetes.io/part-of: cinema
spec:
  scaleTargetRef:
    apiVersion: argoproj.io/v1alpha1
    kind: Rollout
    name: booking
  minReplicas: 1
  # 11/12 4 → 2 (노션 ADR-96): 블루/그린 전환 순간 preview가 active 수까지 늘어 booking 파드가 2배가 된다.
  #   4개면 8개 × 풀 15 = 120 + 다른 서비스 35 = RDS 연결 155 > 경보 130(한도 약 170), requests 2 vCPU.
  #   2개면 4개 × 15 + 35 = 95. SeatSAC 런타임 계약 2장·3장
  maxReplicas: 2
  # 늘릴 때는 1분에 1개씩(노드 2대 — 한 번에 4개로 뛰면 메모리가 모자라 다른 서비스가 밀린다). 줄일 때는 기본(5분 안정화)
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - { type: Pods, value: 1, periodSeconds: 60 }
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 70 }
