# booking — 블루/그린 (ADR-35·58). active=booking, preview=booking-preview, 분석 통과 후 전환, 이전 버전 60초 뒤 축소
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: booking
  labels:
    app.kubernetes.io/name: booking
    app.kubernetes.io/part-of: cinema
spec:
  # replicas를 두지 않는다 — HPA가 관리한다. 두면 ArgoCD가 HPA가 늘린 값을 OutOfSync로 보고 selfHeal로 1로 되돌린다(HPA와 싸움)
  revisionHistoryLimit: 3
  # preview가 이 시간 안에 Ready가 되지 않으면(기동 실패·CrashLoop·이미지 없음) abort → active 유지 (3.1.6)
  #   startupProbe 최대 150초 + 이미지 pull·Flyway 여유. 분석(약 6분)은 이 시간에 포함되지 않는다
  progressDeadlineSeconds: 600
  progressDeadlineAbort: true
  selector:
    matchLabels: { app.kubernetes.io/name: booking }
  strategy:
    blueGreen:
      activeService: booking
      previewService: booking-preview
      autoPromotionEnabled: true          # 분석 통과하면 자동 전환
      # preview는 1개만 — 분석은 1개로 충분하고, HPA가 active를 늘린 상태에서 같은 수로 띄우면 노드 2대에 안 들어간다(남궁일 리뷰)
      #   전환 직전에는 Argo Rollouts가 preview를 active 수까지 늘린다 → 전환 순간~scaleDownDelay 60초만 2배
      previewReplicaCount: 1
      scaleDownDelaySeconds: 60           # 전환 후 이전 버전을 60초 유지 → 드레인·즉시 되돌리기 여유 (ADR-58)
      abortScaleDownDelaySeconds: 30      # 분석 실패(abort) 때 preview 축소까지 — 원인 확인용 로그를 볼 시간
      prePromotionAnalysis:
        templates:
          - templateName: booking-prepromotion     # analysis/
        args:
          - name: preview-hash
            valueFrom:
              # Stable·Latest만 유효하다. 블루/그린 preview(새 ReplicaSet) 해시 = Latest. 다른 값이면 빈 문자열이 넘어가
              # 분석 쿼리가 아무것도 고르지 못하고 or vector(0) → 요청 0건으로 매번 abort된다(10/30~11/1 실측)
              podTemplateHashValue: Latest
  template:
    metadata:
      labels:
        app.kubernetes.io/name: booking
        app.kubernetes.io/part-of: cinema
    spec:
      terminationGracePeriodSeconds: 35
      serviceAccountName: booking           # Pod Identity → 알림 큐 발행 권한 (3.1.9, serviceaccount.yaml)
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      topologySpreadConstraints:              # ng-a·ng-c(AZ a·c)에 나눠 배치
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: { app.kubernetes.io/name: booking }
      initContainers:
        # RDS CA(PEM) → Java 트러스트스토어(PKCS12). Connector/J sslMode=VERIFY_IDENTITY가 서버 인증서·호스트 이름을 검증한다 (3.1.17)
        #   PEM 번들은 인증서 여러 개라 한 장씩 나눠 넣는다(keytool은 번들의 첫 인증서만 읽는다)
        #   트러스트스토어 비밀번호는 공개 CA용 무결성 값이라 비밀이 아니다 → overlay {svc}-config의 trustCertificateKeyStorePassword와 같아야 한다
        - name: rds-truststore
          image: cinema/booking                  # overlay images가 앱 컨테이너와 같은 ECR 주소·태그로 바꾼다 (keytool은 JRE에 있다)
          command:
            - sh
            - -c
            - |
              set -eu
              awk '/BEGIN CERTIFICATE/{n++} n>0{print > ("/tmp/rds-ca-" n ".pem")}' /etc/rds-ca/rds-ca.pem
              for f in /tmp/rds-ca-*.pem; do
                keytool -importcert -noprompt -alias "$(basename "$f" .pem)" -file "$f" \
                  -keystore /truststore/rds-ca.p12 -storetype PKCS12 -storepass rds-ca-truststore
              done
              n=$(keytool -list -keystore /truststore/rds-ca.p12 -storetype PKCS12 -storepass rds-ca-truststore | grep -c trustedCertEntry)
              echo "RDS CA ${n}개를 트러스트스토어에 넣었다"
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
            - { name: rds-ca, mountPath: /etc/rds-ca, readOnly: true }
            - { name: truststore, mountPath: /truststore }
      containers:
        - name: booking
          image: cinema/booking                  # overlay images가 ECR 주소·태그로 바꾼다
          ports:
            - { name: http, containerPort: 8080 }
          envFrom:
          - configMapRef: { name: cinema-infra-endpoints }   # Terraform(staging-k8s) — DB_HOST 등. booking-config의 ${...} 값
          - configMapRef: { name: booking-config }
          - secretRef: { name: booking-secrets }       # Terraform(staging-k8s) 생성
          # readiness 그룹: readinessState,db
          startupProbe:
            httpGet: { path: /actuator/health/readiness, port: http }
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: http }
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: http }
            periodSeconds: 10
            failureThreshold: 3
          lifecycle:
            preStop:
              exec: { command: ["sleep", "5"] }   # 엔드포인트 제거가 퍼질 시간
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits: { memory: 768Mi }        # cpu limit 없음 (스로틀로 p95 악화)
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
            - { name: truststore, mountPath: /truststore, readOnly: true }   # 3.1.17 RDS CA 트러스트스토어
      volumes:
        - { name: tmp, emptyDir: {} }
        - { name: truststore, emptyDir: {} }
        - { name: rds-ca, configMap: { name: rds-ca-bundle } }   # Terraform이 만든다 (gitops에 없음)
