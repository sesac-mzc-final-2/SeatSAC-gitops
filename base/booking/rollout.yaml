# booking — 블루/그린 (ADR-35·58). active=booking, preview=booking-preview, 분석 통과 후 전환, 이전 버전 60초 뒤 축소
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: booking
  labels:
    app.kubernetes.io/name: booking
    app.kubernetes.io/part-of: cinema
spec:
  # replicas를 두지 않는다 — HPA가 관리한다. 두면 ArgoCD가 HPA가 늘린 값을 OutOfSync로 보고 selfHeal로 1로 되돌린다(HPA와 싸움)
  revisionHistoryLimit: 3
  # preview가 이 시간 안에 Ready가 되지 않으면(기동 실패·CrashLoop·이미지 없음) abort → active 유지 (3.1.6)
  #   startupProbe 최대 150초 + 이미지 pull·Flyway 여유. 분석(약 4분)은 이 시간에 포함되지 않는다
  progressDeadlineSeconds: 600
  progressDeadlineAbort: true
  selector:
    matchLabels: { app.kubernetes.io/name: booking }
  strategy:
    blueGreen:
      activeService: booking
      previewService: booking-preview
      autoPromotionEnabled: true          # 분석 통과하면 자동 전환
      # preview는 1개만 — 분석은 1개로 충분하고, HPA가 active를 늘린 상태에서 같은 수로 띄우면 노드 2대에 안 들어간다(남궁일 리뷰)
      #   전환 직전에는 Argo Rollouts가 preview를 active 수까지 늘린다 → 전환 순간~scaleDownDelay 60초만 2배
      previewReplicaCount: 1
      scaleDownDelaySeconds: 60           # 전환 후 이전 버전을 60초 유지 → 드레인·즉시 되돌리기 여유 (ADR-58)
      abortScaleDownDelaySeconds: 30      # 분석 실패(abort) 때 preview 축소까지 — 원인 확인용 로그를 볼 시간
      prePromotionAnalysis:
        templates:
          - templateName: booking-prepromotion     # analysis/
        args:
          - name: preview-hash
            valueFrom:
              podTemplateHashValue: Preview
  template:
    metadata:
      labels:
        app.kubernetes.io/name: booking
        app.kubernetes.io/part-of: cinema
    spec:
      terminationGracePeriodSeconds: 35
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      topologySpreadConstraints:              # ng-a·ng-c(AZ a·c)에 나눠 배치
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: { app.kubernetes.io/name: booking }
      containers:
        - name: booking
          image: cinema/booking                  # overlay images가 ECR 주소·태그로 바꾼다
          ports:
            - { name: http, containerPort: 8080 }
          envFrom:
          - configMapRef: { name: cinema-infra-endpoints }   # Terraform(staging-k8s) — DB_HOST 등. booking-config의 ${...} 값
          - configMapRef: { name: booking-config }
          - secretRef: { name: booking-secrets }       # Terraform(staging-k8s) 생성
          # readiness 그룹: readinessState,db
          startupProbe:
            httpGet: { path: /actuator/health/readiness, port: http }
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: http }
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: http }
            periodSeconds: 10
            failureThreshold: 3
          lifecycle:
            preStop:
              exec: { command: ["sleep", "5"] }   # 엔드포인트 제거가 퍼질 시간
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits: { memory: 768Mi }        # cpu limit 없음 (스로틀로 p95 악화)
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - { name: tmp, emptyDir: {} }
