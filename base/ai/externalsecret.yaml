# 6.4.1 ai_db 비밀번호 — External Secrets (SeatSAC ADR-123·120, 런북 8-F 「ai DB 비밀번호」)
#   값·ARN·계정 ID는 이 레포에 없다 — Secrets Manager 이름과 K8s Secret 이름만
#   ai-secrets: Terraform(ai.tf)이 만든 Secret(ANTHROPIC_API_KEY)에 **두 키만 더한다**(creationPolicy Merge) —
#     cinema/staging/ai = APP_AI_DB_PASSWORD(ai_app) · APP_AI_QUERY_DB_PASSWORD(ai_query). ANTHROPIC_API_KEY는 그대로
#   ai-migrator-secrets: Flyway Job용(FLYWAY_USER·FLYWAY_PASSWORD) — 다른 서비스의 {svc}-migrator-secrets와 같은 방식
#   wave -3: ConfigMap(-2) · Flyway Job(-1) · 앱(0)보다 먼저
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ai-secrets
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: ClusterSecretStore, name: aws-secrets-manager }
  target: { name: ai-secrets, creationPolicy: Merge }
  dataFrom:
    - extract: { key: cinema/staging/ai }                     # APP_AI_DB_PASSWORD · APP_AI_QUERY_DB_PASSWORD
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ai-migrator-secrets
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: ClusterSecretStore, name: aws-secrets-manager }
  target: { name: ai-migrator-secrets, creationPolicy: Merge }
  dataFrom:
    - extract: { key: cinema/staging/ai-migrator }            # Flyway Job: FLYWAY_USER · FLYWAY_PASSWORD
