# ai_db 마이그레이션 — ArgoCD Sync 훅 Job(wave -1, 앱보다 먼저). 다른 서비스 base/{svc}/flyway-job.yaml과 같은 틀
#   (SeatSAC #211 6.4.1: 이미지 /app/db/migration, docs/service-runtime-contract.md 9-1 「ai_db 마이그레이션」)
#   1) initContainer: 같은 ai 이미지(cinema/ai)의 /app/db/migration → emptyDir 복사
#      ⚠ #211 이전 이미지에는 이 폴더가 없어 복사가 실패한다 → cinema-ai sync가 멈춘다. #211 머지·build-push 뒤에만 머지
#   2) flyway: ai_migrator(Secret ai-migrator-secrets)로 migrate. 두 번째 마이그레이션(grant_ai_query_select)이 ai_query에 세 테이블 SELECT를 준다
#      (ai_migrator의 ai_db 범위 GRANT OPTION은 db-bootstrap query-account.sh가 준다)
#   호스트는 Terraform ConfigMap cinema-infra-endpoints의 DB_HOST_AI(자기 인스턴스, ADR-120). TLS 옵션은 booking-flyway 머리 주석과 같다
#   ng-ai 노드가 0대여도 돈다 — nodeSelector·toleration을 두지 않아 일반 노드에서 실행된다(앱 파드만 ng-ai)
#   실패 = sync 실패 → 새 버전이 뜨지 않는다. 이미 적용된 V 파일은 고치지 않고 새 V 번호로
apiVersion: batch/v1
kind: Job
metadata:
  name: ai-flyway
  labels:
    app.kubernetes.io/name: ai-flyway
    app.kubernetes.io/part-of: cinema
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/sync-wave: "-1"
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation   # 다음 sync 전에 지움 → 실패 로그는 남아 있다
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 300
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ai-flyway
        app.kubernetes.io/part-of: cinema
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001          # ai 이미지 사용자와 같게
        runAsGroup: 10001
        fsGroup: 10001
      initContainers:
        - name: copy-migrations
          image: cinema/ai            # kustomize images로 ECR 주소·태그 치환(앱 컨테이너와 같은 태그)
          command: ["sh", "-c", "cp -r /app/db/migration/. /flyway/sql/ && ls /flyway/sql"]
          volumeMounts:
            - { name: sql, mountPath: /flyway/sql }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { memory: 128Mi }
      containers:
        - name: flyway
          image: flyway/flyway:11.7.2
          args: ["migrate"]
          env:
            - name: DB_HOST_AI           # Terraform ConfigMap cinema-infra-endpoints (Public 레포에 엔드포인트를 두지 않는다)
              valueFrom:
                configMapKeyRef: { name: cinema-infra-endpoints, key: DB_HOST_AI }
            - name: FLYWAY_URL
              value: "jdbc:mysql://$(DB_HOST_AI):3306/ai_db?useSsl=true&serverSslCert=/etc/rds-ca/rds-ca.pem&trustServerCertificate=false&disableSslHostnameVerification=false&sslMode=verify-full"
            - { name: FLYWAY_LOCATIONS, value: "filesystem:/flyway/sql" }
            - { name: FLYWAY_CONNECT_RETRIES, value: "5" }
            - { name: FLYWAY_VALIDATE_MIGRATION_NAMING, value: "true" }
            - { name: REDGATE_DISABLE_TELEMETRY, value: "true" }
            - { name: HOME, value: /tmp }
          envFrom:
            - secretRef: { name: ai-migrator-secrets }   # FLYWAY_USER(ai_migrator), FLYWAY_PASSWORD
          volumeMounts:
            - { name: sql, mountPath: /flyway/sql, readOnly: true }
            - { name: tmp, mountPath: /tmp }
            - { name: rds-ca, mountPath: /etc/rds-ca, readOnly: true }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 512Mi }
      volumes:
        - { name: sql, emptyDir: {} }
        - { name: tmp, emptyDir: {} }
        - { name: rds-ca, configMap: { name: rds-ca-bundle } }   # Terraform이 만든다 (gitops에 없음)
