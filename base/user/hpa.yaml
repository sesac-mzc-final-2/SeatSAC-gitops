apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: user
  labels:
    app.kubernetes.io/name: user
    app.kubernetes.io/part-of: cinema
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: user
  minReplicas: 1
  maxReplicas: 2
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 70 }
