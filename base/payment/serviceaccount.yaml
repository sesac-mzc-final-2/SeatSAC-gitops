# payment ServiceAccount — Pod Identity로 AWS 권한을 받는다 (6.1.3, ADR-117)
#   SeatSAC Terraform envs/staging/messaging.tf의 Pod Identity 연결(namespace cinema-staging · 이름 payment)과 이름이 같아야 한다
#   역할 cinema-staging-payment-pod: payment-commands 수신 · booking-replies 발송만 (런타임 계약 2장). 액세스 키 없음
#   쿠버네티스 API 토큰은 쓰지 않는다(automount 끔). Pod Identity 토큰은 웹훅이 따로 projected 볼륨으로 붙인다 (booking과 같다)
apiVersion: v1
kind: ServiceAccount
metadata:
  name: payment
  labels:
    app.kubernetes.io/name: payment
    app.kubernetes.io/part-of: cinema
automountServiceAccountToken: false
