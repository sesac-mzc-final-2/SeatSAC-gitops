# catalog 인바운드 허용 (docs/service-runtime-contract.md 6장, 3.1.13). egress는 막지 않는다
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: catalog-ingress
  labels:
    app.kubernetes.io/name: catalog
    app.kubernetes.io/part-of: cinema
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/name: catalog }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: { matchLabels: { app.kubernetes.io/name: gateway } }
      ports: [{ port: 8080, protocol: TCP }]
    - from:
        - podSelector: { matchLabels: { app.kubernetes.io/name: booking } }
      ports: [{ port: 8080, protocol: TCP }]
    - from:
        - podSelector: { matchLabels: { app.kubernetes.io/name: user } }
      ports: [{ port: 8080, protocol: TCP }]
    - from:                                   # Prometheus 수집
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: monitoring } }
      ports: [{ port: 8080, protocol: TCP }]
