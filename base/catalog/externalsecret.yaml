# 6.1.4 External Secrets (SeatSAC ADR-123, 런북 8-F): Secrets Manager cinema/staging/{name} → K8s Secret
#   값·ARN·계정 ID는 이 레포에 없다 — Secrets Manager 이름과 K8s Secret 이름만. 키는 그대로 푼다(dataFrom.extract)
#   wave -3: ConfigMap(-2) · Flyway Job(-1) · 앱(0)보다 먼저
#   creationPolicy Merge: 지금은 Terraform이 만든 Secret에 **같은 키를 같은 값으로** 쓴다(소유자는 아직 Terraform).
#     Terraform이 Secret을 state에서 뺀 뒤(런북 8-F 3번) Owner로 바꾼다 — 그때부터 빈 클러스터에서도 ESO가 처음부터 만든다
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: catalog-secrets
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: ClusterSecretStore, name: aws-secrets-manager }
  target: { name: catalog-secrets, creationPolicy: Merge }
  dataFrom:
    - extract: { key: cinema/staging/catalog }                # 앱: SPRING_DATASOURCE_PASSWORD 등
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: catalog-migrator-secrets
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: ClusterSecretStore, name: aws-secrets-manager }
  target: { name: catalog-migrator-secrets, creationPolicy: Merge }
  dataFrom:
    - extract: { key: cinema/staging/catalog-migrator }       # Flyway Job: FLYWAY_USER · FLYWAY_PASSWORD
