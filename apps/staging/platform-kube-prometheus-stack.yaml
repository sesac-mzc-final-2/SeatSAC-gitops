# 차트 버전 고정(kube-prometheus-stack 92.13.1, 3.1.5). 올릴 때만 PR — 먼저 helm search repo로 실제 있는 버전인지 확인
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-prometheus-stack
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
spec:
  project: cinema
  sources:
    - repoURL: https://prometheus-community.github.io/helm-charts
      chart: kube-prometheus-stack
      targetRevision: 92.13.1
      helm:
        valueFiles: [$values/platform/kube-prometheus-stack/values.yaml]
    - repoURL: https://github.com/sesac-mzc-final-2/SeatSAC-gitops.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true, ServerSideApply=true]
    retry:
      limit: 10
      backoff: { duration: 10s, factor: 2, maxDuration: 3m }
