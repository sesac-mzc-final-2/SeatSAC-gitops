# 앱 namespace 공통: 인바운드 기본 거부 NetworkPolicy + AnalysisTemplate(Rollout CRD 필요 → argo-rollouts(-10) 다음)
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cinema-common
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
spec:
  project: cinema
  source:
    repoURL: https://github.com/sesac-mzc-final-2/SeatSAC-gitops.git
    targetRevision: main
    path: base/common
  destination:
    server: https://kubernetes.default.svc
    namespace: cinema-staging
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    retry:
      limit: 10
      backoff: { duration: 10s, factor: 2, maxDuration: 3m }
