# 6.1.4 External Secrets Operator (SeatSAC ADR-123). 차트 버전 고정(external-secrets 2.15.0). 올릴 때만 PR — helm search repo로 확인
# wave -10: CRD(ExternalSecret·ClusterSecretStore)가 서비스 앱(ExternalSecret, wave -3)보다 먼저 있어야 한다
# 전제(SeatSAC Terraform, 런북 8-F): Pod Identity cinema-staging-external-secrets-pod(external-secrets/external-secrets) ·
#   Secrets Manager cinema/staging/*. 이 레포에는 Secret 이름만 둔다 — ARN·계정 ID·값은 쓰지 않는다
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
spec:
  project: cinema
  sources:
    - repoURL: https://charts.external-secrets.io
      chart: external-secrets
      targetRevision: 2.15.0
      helm:
        valueFiles: [$values/platform/external-secrets/values.yaml]
    - repoURL: https://github.com/sesac-mzc-final-2/SeatSAC-gitops.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true, ServerSideApply=true]
    retry:
      limit: 10
      backoff: { duration: 10s, factor: 2, maxDuration: 3m }
