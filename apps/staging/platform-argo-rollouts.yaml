# 차트 버전 고정(argo-rollouts 2.43.8, 3.1.5). 올릴 때만 PR — 먼저 helm search repo로 실제 있는 버전인지 확인
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argo-rollouts
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
spec:
  project: cinema
  sources:
    - repoURL: https://argoproj.github.io/argo-helm
      chart: argo-rollouts
      targetRevision: 2.43.8
      helm:
        valueFiles: [$values/platform/argo-rollouts/values.yaml]
    - repoURL: https://github.com/sesac-mzc-final-2/SeatSAC-gitops.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: argo-rollouts
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true, ServerSideApply=true]
    retry:
      limit: 10
      backoff: { duration: 10s, factor: 2, maxDuration: 3m }
