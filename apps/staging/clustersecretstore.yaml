# 6.1.4 ClusterSecretStore — ESO가 Secrets Manager를 읽는 연결 (SeatSAC ADR-123)
#   자격 증명을 적지 않는다: ESO 파드의 Pod Identity(cinema-staging-external-secrets-pod)를 그대로 쓴다.
#   읽을 수 있는 범위는 그 역할의 IAM 정책(cinema/staging/* 만)이 정한다. 여기에는 리전만 있다 — ARN·계정 ID 없음
#   wave -8: external-secrets(-10, CRD·컨트롤러) 다음, cinema-common(-5)·서비스 앱보다 먼저
#   클러스터 범위 리소스라 namespace를 붙이는 kustomization(base/common)에 두지 않고 root 앱(apps/staging)이 직접 sync한다
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: aws-secrets-manager
  annotations:
    argocd.argoproj.io/sync-wave: "-8"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true   # 빈 클러스터에서 CRD가 아직 없을 때 dry-run으로 멈추지 않게
spec:
  conditions:
    - namespaces: [cinema-staging]     # 앱 namespace의 ExternalSecret만 이 연결을 쓸 수 있다
  provider:
    aws:
      service: SecretsManager
      region: ap-northeast-2
