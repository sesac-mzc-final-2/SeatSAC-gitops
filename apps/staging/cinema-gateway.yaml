apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cinema-gateway
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: cinema
  source:
    repoURL: git@github.com:sesac-mzc-final-2/SeatSAC-gitops.git
    targetRevision: main
    path: overlays/staging/gateway
  destination:
    server: https://kubernetes.default.svc
    namespace: cinema-staging
  syncPolicy:
    automated: { prune: true, selfHeal: true }
