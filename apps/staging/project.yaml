apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: cinema
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-20"   # 이 프로젝트를 쓰는 앱(-10·-5)보다 먼저. 늦으면 앱이 "project does not exist"로 멈춘다
spec:
  description: SeatSAC staging
  sourceRepos:
    - https://github.com/sesac-mzc-final-2/SeatSAC-gitops.git
    - https://argoproj.github.io/argo-helm
    - https://prometheus-community.github.io/helm-charts
    - https://grafana.github.io/helm-charts            # loki · alloy (3.1.24). 공용 cinema 프로젝트에 둔다 — argo-helm·prometheus-community와 같은 플랫폼 차트 저장소이고,
                                                       # 차트·버전은 각 Application에서 고정한다(앱이 2개라 프로젝트를 나눌 이득이 없다). 이 레포 PR 리뷰가 사용처를 막는다
  destinations:
    - { server: https://kubernetes.default.svc, namespace: cinema-staging }
    - { server: https://kubernetes.default.svc, namespace: monitoring }
    - { server: https://kubernetes.default.svc, namespace: argo-rollouts }
    - { server: https://kubernetes.default.svc, namespace: kube-system }   # kube-prometheus-stack이 만드는 kubelet 등 Service
  clusterResourceWhitelist:
    - { group: "*", kind: "*" }     # CRD·ClusterRole (플랫폼 차트). cinema-ops·Secret은 Terraform만
