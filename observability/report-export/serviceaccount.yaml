# 6.1.9 리포트 내보내기 — Pod Identity cinema-staging-report-export-pod(SeatSAC envs/staging/reports.tf)가 이 ServiceAccount에 연결된다.
#   권한은 리포트 버킷 errors/ 쓰기뿐. Kubernetes API는 쓰지 않는다
apiVersion: v1
kind: ServiceAccount
metadata:
  name: report-export
  labels:
    app.kubernetes.io/name: report-export
    app.kubernetes.io/part-of: cinema
automountServiceAccountToken: false
