# 6.1.9 오류·보안 리포트 내보내기 (SeatSAC ADR-121, 런북 6-M) — 10분마다 Loki → S3 errors/dt=YYYY-MM-DD/HH.json.gz
#   1) initContainer export(python 표준 라이브러리, export.py): Loki에서 지난 3개 KST 정시 구간 + 진행 중인 시간(지금까지)의
#      errorCategory 줄 → /work/errors. 진행 중인 시간 파일은 10분마다 커진다 → 리포트가 최대 약 10분 늦다(11/27 — 매시에서)
#   2) upload(aws-cli): /work/errors → s3://$REPORTS_BUCKET/errors/ (Pod Identity cinema-staging-report-export-pod, errors/ 쓰기만)
#   - 버킷 이름은 계정 ID가 들어가 Terraform ConfigMap report-export(envs/staging-k8s/reports.tf)에서 받는다 — 이 레포에 없다
#   - 같은 시간 파일은 매번 다시 만든다(멱등). 밤에 노드가 0대라 건너뛴 시간은 아침 첫 실행이 앞 3시간을 채운다
#   - Loki 3100은 NetworkPolicy loki-ingress가 이 파드(app.kubernetes.io/name: report-export)를 허용해야 닿는다(platform/loki/values.yaml)
apiVersion: batch/v1
kind: CronJob
metadata:
  name: report-export
  labels:
    app.kubernetes.io/name: report-export
    app.kubernetes.io/part-of: cinema
spec:
  schedule: "*/10 * * * *"           # 10분마다 — ops-api 결과 캐시는 새 파일이 올라오면 버린다(SeatSAC reports.py)
  concurrencyPolicy: Forbid           # 앞 실행이 끝나지 않았으면 건너뛴다
  startingDeadlineSeconds: 300
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 540       # 다음 실행(10분) 전에 끝낸다
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app.kubernetes.io/name: report-export
            app.kubernetes.io/part-of: cinema
        spec:
          serviceAccountName: report-export
          automountServiceAccountToken: true   # Pod Identity 토큰 주입에 필요(Kubernetes API는 쓰지 않는다)
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            fsGroup: 10001
            seccompProfile: { type: RuntimeDefault }
          initContainers:
            - name: export
              image: python:3.12.8-slim
              command: ["python3", "/app/export.py"]
              env:
                - { name: LOKI_URL, value: "http://loki.monitoring.svc:3100" }
                - { name: EXPORT_HOURS, value: "3" }
                - { name: EXPORT_CURRENT_HOUR, value: "true" }
                - { name: OUT_DIR, value: /work/errors }
                - { name: HOME, value: /tmp }
              volumeMounts:
                - { name: script, mountPath: /app, readOnly: true }
                - { name: work, mountPath: /work }
                - { name: tmp, mountPath: /tmp }
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: { drop: ["ALL"] }
              resources:
                requests: { cpu: 50m, memory: 128Mi }
                limits: { memory: 256Mi }
          containers:
            - name: upload
              image: amazon/aws-cli:2.22.0
              command: ["sh", "-c"]
              args:
                - |
                  set -eu
                  if [ -z "$(ls -A /work/errors 2>/dev/null)" ]; then echo '{"upload":0}'; exit 0; fi
                  aws s3 cp /work/errors "s3://${REPORTS_BUCKET}/errors/" --recursive --only-show-errors \
                    --content-type application/gzip
                  echo "{\"upload\":$(find /work/errors -type f | wc -l)}"
              envFrom:
                - configMapRef: { name: report-export }   # Terraform(staging-k8s) — REPORTS_BUCKET · AWS_REGION
              env:
                - { name: HOME, value: /tmp }
                - { name: AWS_PAGER, value: "" }
              volumeMounts:
                - { name: work, mountPath: /work, readOnly: true }
                - { name: tmp, mountPath: /tmp }
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: { drop: ["ALL"] }
              resources:
                requests: { cpu: 50m, memory: 128Mi }
                limits: { memory: 256Mi }
          volumes:
            - name: script
              configMap: { name: report-export-script }
            - { name: work, emptyDir: { sizeLimit: 256Mi } }
            - { name: tmp, emptyDir: { sizeLimit: 64Mi } }
