# Alloy (3.1.24, SeatSAC ADR-113 가번호) — cinema-staging 파드 로그를 Kubernetes API로 읽어 Loki로 보낸다
#   - 파드 1개(Deployment). 노드마다 뜨는 DaemonSet·hostPath(/var/log)를 쓰지 않아 노드 구성·ng-ai taint와 무관하게
#     ai(ng-ai) 로그까지 모인다(ai 격리 원칙: 다른 Application·ai 매니페스트를 고치지 않는다)
#   - 권한: cinema-staging namespace의 파드·파드 로그 읽기 Role만(ClusterRole 없음)
#   - 라벨: namespace · app(app.kubernetes.io/name) · container · pod. traceId·userId는 라벨로 만들지 않는다(| json 으로 검색)
#   - 개인정보: gateway 접근 로그의 clientIp(사용자 공인 IP)는 저장 전에 *** 로 가린다
crds:
  create: false                  # PodLogs CRD(loki.source.podlogs) 안 씀

controller:
  type: deployment
  replicas: 1

rbac:
  create: true
  namespaces: [cinema-staging]   # Role·RoleBinding을 이 namespace에만
  rules:
    - apiGroups: [""]
      resources: ["pods", "pods/log"]
      verbs: ["get", "list", "watch"]

alloy:
  stabilityLevel: generally-available
  clustering:
    enabled: false
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { memory: 256Mi }
  configMap:
    create: true
    content: |
      // cinema-staging 파드만 찾는다(Role 범위와 같다)
      discovery.kubernetes "pods" {
        role = "pod"
        namespaces {
          names = ["cinema-staging"]
        }
      }

      discovery.relabel "pods" {
        targets = discovery.kubernetes.pods.targets

        // 컨테이너 포트마다 대상이 생긴다 → 포트 없는 컨테이너(Job)와 8080만 남겨 같은 로그를 두 번 읽지 않는다
        rule {
          source_labels = ["__meta_kubernetes_pod_container_port_number"]
          regex         = "|8080"
          action        = "keep"
        }
        rule {
          source_labels = ["__meta_kubernetes_namespace"]
          target_label  = "namespace"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name"]
          target_label  = "app"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_container_name"]
          target_label  = "container"
        }
        // 블루/그린 전환·abort 뒤 이전 버전 파드를 가려 보려고 둔다(파드 수가 적어 스트림 수가 작다)
        rule {
          source_labels = ["__meta_kubernetes_pod_name"]
          target_label  = "pod"
        }
      }

      loki.source.kubernetes "pods" {
        targets    = discovery.relabel.pods.output
        forward_to = [loki.process.mask.receiver]
      }

      // gateway 접근 로그 "clientIp":"1.2.3.4" → "clientIp":"***"
      loki.process "mask" {
        stage.replace {
          expression = "\"clientIp\":\"([^\"]*)\""
          replace    = "***"
        }
        forward_to = [loki.write.default.receiver]
      }

      loki.write "default" {
        endpoint {
          url = "http://loki.monitoring.svc.cluster.local:3100/loki/api/v1/push"
        }
      }
