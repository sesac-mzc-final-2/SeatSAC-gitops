# CodeRabbit AI 코드 리뷰 설정 (SeatSAC-gitops) — https://docs.coderabbit.ai/reference/configuration
# 리뷰 기본값(언어·톤·profile·승인 방식·gitleaks 끔)은 SeatSAC .coderabbit.yaml과 같게 둔다. 경로별 지침만 이 레포용이다
# Public 레포라 무료 플랜으로 전체 리뷰가 된다. 설치는 조직 owner가 CodeRabbit GitHub App의 Repository access에 이 레포를 추가한다
# build-push 봇의 태그 커밋은 PR 없이 main에 바로 들어가므로 리뷰 대상이 아니다(사람 PR만 리뷰된다)
# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json

language: ko-KR
tone_instructions: "한국어로 간결하게. 배포 장애·보안·계약(SeatSAC docs/service-runtime-contract.md) 위반을 우선하고, 취향 문제는 짧게 제안만 한다."

reviews:
  profile: chill
  request_changes_workflow: false    # 승인·변경요청은 사람(CODEOWNERS)이 한다
  high_level_summary: true
  poem: false
  review_status: true
  collapse_walkthrough: true

  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - "^main$"

  path_filters:
    - "!charts/**"
    - "!**/*.tgz"

  # 경로별 리뷰 지침. 이름·값의 기준은 SeatSAC docs/service-runtime-contract.md(런타임 계약)와 이 레포 README
  path_instructions:
    - path: "**"
      instructions: >
        이 레포는 Public이다(ADR-74). 12자리 계정 ID, AWS 서비스 주소(amazonaws 도메인의 RDS·Valkey·SQS·Cognito·ECR), images의 newName,
        kind: Secret 매니페스트, 키·토큰·비밀번호가 어떤 파일에든 보이면 반드시 지적한다.
        엔드포인트는 ${키}(Terraform ConfigMap cinema-infra-endpoints)로만, 레지스트리는 Terraform ArgoCD Application이 붙인다.
        이 레포의 main 머지 = staging 배포다. 클러스터 동작이 바뀌는 변경은 요약에 "배포 영향"으로 명시한다.
        booking과 gateway(블루/그린)를 한 PR에서 같이 배포하게 바꾸면 지적한다(노드 2대, 동시 블루/그린 금지).

    - path: "overlays/staging/*/image-tag/**"
      instructions: >
        이미지 태그 전용 Component다. 평소에는 SeatSAC build-push 봇(seatsac-build-push[bot])만 newTag를 바꾼다.
        사람 PR이면 롤백(이전 태그 커밋 revert)인지 확인하고, 태그는 git SHA 7자리(소문자 16진수)여야 한다. latest·브랜치 이름은 지적한다.
        newName이 추가되면 계정 ID가 들어가므로 반드시 지적한다.

    - path: "overlays/staging/*/kustomization.yaml"
      instructions: >
        {svc}-config의 키는 런타임 계약 3장 이름만 쓴다(SPRING_* 표준 바인딩, APP_* 앱 고유). 새 키가 보이면 계약 문서에 있는지 묻는다.
        ${...} 자리는 DB_HOST·VALKEY_HOST·SQS_NOTIFICATION_URL·COGNITO_ISSUER_URI·COGNITO_CLIENT_ID만 허용한다. 다른 이름이면 Terraform infra_endpoints.tf에 없는 키라 기동 실패다.
        엔드포인트·URL을 값으로 직접 적으면 지적한다(서비스 간 주소 http://{svc}:8080 은 허용).
        configMapGenerator의 sync-wave는 "-2"(Flyway Job -1보다 먼저)여야 한다. images 블록을 overlay에 직접 두면 지적한다(image-tag Component로).
        블루/그린 서비스(booking·gateway)는 components에 ../../../components/rollout 이 있어야 한다.

    - path: "base/**"
      instructions: >
        모든 서비스 공통 규칙(런타임 계약 1·2장): 포트 8080 하나, 포트 이름 http, 라벨 app.kubernetes.io/name={svc}·app.kubernetes.io/part-of=cinema.
        securityContext runAsNonRoot·숫자 UID·readOnlyRootFilesystem·allowPrivilegeEscalation false·capabilities drop ALL, 쓰기는 /tmp emptyDir만.
        startupProbe·readinessProbe(/actuator/health/readiness)·livenessProbe(/actuator/health/liveness), preStop sleep 5, terminationGracePeriodSeconds 35.
        requests cpu·memory와 limits memory는 계약 2장 표 값과 같아야 하고 limits cpu는 두지 않는다. 값이 바뀌면 계약 문서도 바뀌었는지 묻는다.
        envFrom 순서는 cinema-infra-endpoints → {svc}-config → {svc}-secrets(gateway는 secrets 없음). 이름만 참조하고 Secret을 만들지 않는다.
        이미지는 이름 cinema/{svc}만 쓴다(태그·레지스트리 없음).

    - path: "base/*/flyway-job.yaml"
      instructions: >
        ArgoCD Sync 훅 Job: hook Sync, sync-wave "-1", hook-delete-policy BeforeHookCreation, backoffLimit 0 이어야 한다(PreSync로 바꾸면 첫 배포 때 ConfigMap보다 먼저 돌아 실패).
        flyway 이미지는 flyway/flyway:11.7.2 고정. initContainer는 같은 앱 이미지(cinema/{svc})로 /app/db/migration을 복사한다.
        env DB_HOST(configMapKeyRef cinema-infra-endpoints)가 FLYWAY_URL보다 앞에 있어야 $(DB_HOST)가 치환된다.
        FLYWAY_URL에서 useSsl=true·serverSslCert=/etc/rds-ca/rds-ca.pem 이 빠지거나 trustServerCertificate=true·disableSslHostnameVerification=true 가 되면 지적한다(인증서 검증 끔).
        계정은 {svc}-migrator-secrets만 쓴다. 앱 Secret이나 마스터 계정을 쓰면 지적한다.

    - path: "base/{booking,gateway}/**"
      instructions: >
        Argo Rollouts 블루/그린: activeService {svc}, previewService {svc}-preview, prePromotionAnalysis(analysis/), scaleDownDelaySeconds 60, autoPromotionEnabled 확인.
        gateway는 HPA가 없어야 한다(블루/그린 중 2개). booking HPA는 1~4, CPU 70%.

    - path: "base/gateway/ingress.yaml"
      instructions: >
        Ingress 이름 gateway·namespace cinema-staging은 CloudFront가 ALB를 찾는 태그(ingress.k8s.aws/stack)라 바꾸면 지적한다.
        security-groups는 SG 이름 cinema-staging-alb(ID 금지), target-type ip, 유휴 120초·deregistration 30초, health check는 readiness 경로여야 한다.
        listen-ports에 443이나 0.0.0.0/0 인바운드를 여는 변경은 ADR-66(CloudFront 원본 구간) 결정과 함께 보아야 한다.

    - path: "base/**/networkpolicy.yaml"
      instructions: >
        인바운드 허용은 런타임 계약 6장 표만: ALB(VPC CIDR)→gateway, gateway→catalog·booking·user, catalog→booking, booking→catalog·payment, user→booking·catalog, monitoring→전체(8080).
        표에 없는 허용, namespaceSelector 전체 허용, egress 제한 추가는 지적한다.

    - path: "base/**/podmonitor.yaml"
      instructions: >
        PodMonitor만 쓴다(ServiceMonitor는 active·preview Service가 같은 파드를 두 번 수집). 포트 http, 경로 /actuator/prometheus, 15초,
        rollouts-pod-template-hash 라벨을 메트릭에 붙여야 블루/그린 분석이 preview 파드를 구분한다.

    - path: "analysis/**"
      instructions: >
        블루/그린 분석 조건(런타임 계약 5장): booking은 5xx 비율 ≤ 1% 그리고 booking_payment_call_total의 timeout·error 비율 ≤ 5%(declined 제외),
        gateway는 5xx 비율 ≤ 1%. 1분 간격 3회, preview 파드(rollouts-pod-template-hash)만. 임계값·메트릭 이름이 바뀌면 지적한다.
        요청이 0건일 때 0으로 나눠 통과하거나 실패하는 쿼리인지 본다.

    - path: "apps/**"
      instructions: >
        App of Apps다. repoURL은 https://github.com/sesac-mzc-final-2/SeatSAC-gitops.git (Public, 자격 증명 없음). SSH 주소로 바꾸면 지적한다.
        root 앱(cinema-root)과 서비스 Application(cinema-{gateway,catalog,booking,user,payment})은 SeatSAC Terraform(envs/staging-k8s/argocd_apps.tf)이 만든다(레지스트리 주소 때문). 여기 추가되면 지적한다.
        AppProject는 sync-wave -20, 플랫폼 -10, cinema-common -5 순서를 유지한다. 각 앱의 syncPolicy.retry를 지우면 지적한다.
        Helm 차트 targetRevision은 정확한 버전으로 고정한다. *·latest·범위 표기·CHANGE_ME는 지적한다.
        AppProject의 sourceRepos·destinations가 넓어지면 이유를 묻는다.

    - path: "components/**"
      instructions: >
        kustomize가 Rollout CRD 안의 ConfigMap·Secret·Service·AnalysisTemplate 이름 참조를 바꾸게 하는 설정이다. 경로가 빠지면 해시 이름이 반영되지 않아 파드가 옛 ConfigMap을 본다.

    - path: ".github/**"
      instructions: >
        워크플로 권한(permissions)은 최소로, 서드파티 액션·다운로드 도구는 버전 고정과 체크섬 확인인지 본다.
        gitops-validate의 Public 금지 값 검사·Secret 검사·gitleaks를 약하게 만드는 변경은 반드시 지적한다.

  # gitleaks는 gitops-validate 워크플로가 돌린다 → 중복 알림을 막기 위해 끈다 (SeatSAC와 같음)
  tools:
    gitleaks:
      enabled: false

chat:
  auto_reply: true

knowledge_base:
  code_guidelines:
    enabled: true
    filePatterns:
      - "README.md"
