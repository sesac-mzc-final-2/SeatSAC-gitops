# booking staging 값. 이 레포는 Public → 계정 ID·엔드포인트·키를 쓰지 않는다 (gitops-validate가 막는다)
#   - 이미지 태그: ./image-tag (SeatSAC build-push가 newTag만 커밋. 사람이 직접 바꾸지 않는다, 롤백은 revert PR)
#   - 레지스트리 주소: ArgoCD Application(SeatSAC Terraform envs/staging-k8s/argocd_apps.tf)의 kustomize.images가 붙인다
#   - ${DB_HOST} 같은 값: Terraform ConfigMap cinema-infra-endpoints(envs/staging-k8s/infra_endpoints.tf)를
#     파드가 envFrom으로 같이 받고, Spring이 기동 때 치환한다 (쿠버네티스는 envFrom 값을 치환하지 않는다)
#   - Secret 값은 여기 두지 않는다 (booking-secrets·booking-migrator-secrets는 Terraform)
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: cinema-staging
resources:
  - ../../../base/booking
components:
  - ../../../components/rollout   # Rollout 안의 ConfigMap 이름(해시)도 바꾸게
  - ./image-tag                   # 태그만. 레지스트리는 ArgoCD가 이 overlay에 images(이름만)로 붙인다
generatorOptions:
  annotations:
    argocd.argoproj.io/sync-wave: "-2"     # Flyway Job(-1)보다 먼저
configMapGenerator:
  - name: booking-config
    literals:
      - SPRING_PROFILES_ACTIVE=staging
      - AWS_REGION=ap-northeast-2
      - SPRING_DATASOURCE_URL=jdbc:mysql://${DB_HOST}:3306/booking_db?connectionTimeZone=UTC&sslMode=REQUIRED
      - SPRING_DATASOURCE_USERNAME=booking_app
      - SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE=5
      - SPRING_FLYWAY_ENABLED=false
      - SPRING_DATA_REDIS_HOST=${VALKEY_HOST}
      - SPRING_DATA_REDIS_PORT=6379
      - SPRING_DATA_REDIS_SSL_ENABLED=true
      - APP_SERVICES_CATALOG_URL=http://catalog:8080
      - APP_SERVICES_PAYMENT_URL=http://payment:8080
      - APP_SQS_NOTIFICATION_QUEUE_URL=${SQS_NOTIFICATION_URL}
      - APP_SEAT_HOLD_TTL_SECONDS=300
      - APP_SEAT_HOLD_STRATEGY=redis
      - APP_OUTBOX_RELAY_INTERVAL=1s
