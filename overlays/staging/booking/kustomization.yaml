# booking staging 값. 이 레포는 Public → 계정 ID·엔드포인트·키를 쓰지 않는다 (gitops-validate가 막는다)
#   - 이미지 태그: ./image-tag (SeatSAC build-push가 newTag만 커밋. 사람이 직접 바꾸지 않는다, 롤백은 revert PR)
#   - 레지스트리 주소: ArgoCD Application(SeatSAC Terraform envs/staging-k8s/argocd_apps.tf)의 kustomize.images가 붙인다
#   - ${DB_HOST} 같은 값: Terraform ConfigMap cinema-infra-endpoints(envs/staging-k8s/infra_endpoints.tf)를
#     파드가 envFrom으로 같이 받고, Spring이 기동 때 치환한다 (쿠버네티스는 envFrom 값을 치환하지 않는다)
#   - Secret 값은 여기 두지 않는다 (booking-secrets·booking-migrator-secrets는 Terraform)
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: cinema-staging
resources:
  - ../../../base/booking
components:
  - ../../../components/rollout   # Rollout 안의 ConfigMap 이름(해시)도 바꾸게
  - ./image-tag                   # 태그만. 레지스트리는 ArgoCD가 이 overlay에 images(이름만)로 붙인다
generatorOptions:
  annotations:
    argocd.argoproj.io/sync-wave: "-2"     # Flyway Job(-1)보다 먼저
configMapGenerator:
  - name: booking-config
    literals:
      - SPRING_PROFILES_ACTIVE=staging
      - AWS_REGION=ap-northeast-2
      - SPRING_DATASOURCE_URL=jdbc:mysql://${DB_HOST}:3306/booking_db?connectionTimeZone=UTC&sslMode=VERIFY_IDENTITY&trustCertificateKeyStoreUrl=file:/truststore/rds-ca.p12&trustCertificateKeyStoreType=PKCS12&trustCertificateKeyStorePassword=rds-ca-truststore
      - SPRING_DATASOURCE_USERNAME=booking_app
      # 4.2.1(11/11): 같은 좌석 100명 경쟁에서 진 요청 99건도 409 사유(HELD·RESERVED)를 DB로 확인해 풀 5개 앞에 줄을 섰다
      #   (hikaricp acquire 최대 0.547초, 선점 p95 849~1187ms). SeatSAC 런타임 계약 3장
      #   연결 수(RDS db.t4g.small 최대 약 170, 경보 130, 노션 ADR-96 11/12): booking maxReplicas 2(base/booking/hpa.yaml)
      #   → 평소 2개 × 15 = 30 + 다른 서비스 35 = 65, 블루/그린 전환 순간~60초(preview = active 수) 4개 × 15 + 35 = 95
      #   최소 유휴는 Hikari 기본(= 최대 풀 15)으로 둔다 — 조용하던 파드에 100명이 몰릴 때 연결을 하나씩 새로 여느라
      #   풀 5처럼 줄 서지 않게(#21 리뷰 @namgungil). 상한은 maxReplicas가 정하므로 최소 유휴와 무관하다
      - SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE=15
      - SPRING_FLYWAY_ENABLED=false
      - SPRING_DATA_REDIS_HOST=${VALKEY_HOST}
      - SPRING_DATA_REDIS_PORT=6379
      - SPRING_DATA_REDIS_SSL_ENABLED=true
      - APP_SERVICES_CATALOG_URL=http://catalog:8080
      - APP_SERVICES_PAYMENT_URL=http://payment:8080
      - APP_SQS_NOTIFICATION_QUEUE_URL=${SQS_NOTIFICATION_URL}
      - APP_SEAT_HOLD_TTL_SECONDS=300
      - APP_SEAT_HOLD_STRATEGY=redis
      - APP_OUTBOX_RELAY_INTERVAL=1s
      - APP_OUTBOX_RELAY_ENABLED=true   # 3.2.6 예매 완료 알림 아웃박스 → SQS 릴레이(SeatSAC 런북 6-B-3, 6-B-5 끝에서 끝 확인 11/11). 풀 15와 한 커밋 = booking 블루/그린 1회
