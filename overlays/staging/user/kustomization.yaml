# user staging 값. 이 레포는 Public → 계정 ID·엔드포인트·키를 쓰지 않는다 (gitops-validate가 막는다)
#   - 이미지 태그: ./image-tag (SeatSAC build-push가 newTag만 커밋. 사람이 직접 바꾸지 않는다, 롤백은 revert PR)
#   - 레지스트리 주소: ArgoCD Application(SeatSAC Terraform envs/staging-k8s/argocd_apps.tf)의 kustomize.images가 붙인다
#   - ${DB_HOST} 같은 값: Terraform ConfigMap cinema-infra-endpoints(envs/staging-k8s/infra_endpoints.tf)를
#     파드가 envFrom으로 같이 받고, Spring이 기동 때 치환한다 (쿠버네티스는 envFrom 값을 치환하지 않는다)
#   - Secret 값은 여기 두지 않는다 (user-secrets·user-migrator-secrets는 Terraform)
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: cinema-staging
resources:
  - ../../../base/user
components:
  - ./image-tag                   # 태그만. 레지스트리는 ArgoCD가 이 overlay에 images(이름만)로 붙인다
generatorOptions:
  annotations:
    argocd.argoproj.io/sync-wave: "-2"     # Flyway Job(-1)보다 먼저
configMapGenerator:
  - name: user-config
    literals:
      - SPRING_PROFILES_ACTIVE=staging
      - AWS_REGION=ap-northeast-2
      # 6.1.5 자기 인스턴스(DB_HOST_USER, ADR-115) — base/user/flyway-job.yaml의 호스트 키와 같은 PR에서. 쓰기 멈춤 → db-migrate.sh copy user PASS 뒤 머지(런북 8-E 3)
      - SPRING_DATASOURCE_URL=jdbc:mysql://${DB_HOST_USER}:3306/user_db?connectionTimeZone=UTC&sslMode=VERIFY_IDENTITY&trustCertificateKeyStoreUrl=file:/truststore/rds-ca.p12&trustCertificateKeyStoreType=PKCS12&trustCertificateKeyStorePassword=rds-ca-truststore
      - SPRING_DATASOURCE_USERNAME=user_app
      - SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE=5
      - SPRING_FLYWAY_ENABLED=false
      - APP_SERVICES_BOOKING_URL=http://booking:8080
      - APP_SERVICES_CATALOG_URL=http://catalog:8080
      # 6.3.4b 예매 내역 복제본(SeatSAC #220) — 받는 쪽 먼저: 소비자를 켜고 Healthy·큐 비는 것을 본 뒤 booking SNS 발행
      - APP_MESSAGING_BOOKING_EVENTS_URL=${SQS_USER_BOOKING_EVENTS_URL}
      - APP_MESSAGING_CONSUMER_ENABLED=true
      # 6.5.1b 예매 내역을 복제본에서 읽는다(API 명세서 v1.5 23-1). 소비자가 쌓인 이벤트를 다 읽은 뒤(user-booking-events 대기 0).
      #   되돌리기는 이 줄 revert(바로 sync — 복제본은 남는다). 확인 절차 SeatSAC 런북 terraform-infra 6-M 1)
      - APP_BOOKING_HISTORY_MODE=local
