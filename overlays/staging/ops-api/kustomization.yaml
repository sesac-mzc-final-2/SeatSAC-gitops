# 🆕 ops-api staging 값 (런타임 계약 10장). 이 레포는 Public → 계정 ID·엔드포인트·키를 쓰지 않는다 (gitops-validate가 막는다)
#   - 이미지 태그: ./image-tag (SeatSAC build-push가 newTag만 커밋 — 저장소 변수 OPS_BUILD_PUSH_ENABLED=true 뒤부터, 런북 6-K)
#   - 레지스트리 주소: ArgoCD Application cinema-ops-api(SeatSAC Terraform envs/staging-k8s/argocd_apps.tf)의 kustomize.images
#   - COGNITO_*·PROMETHEUS_URL·REPORTS_BUCKET·ATHENA_WORKGROUP: Terraform ConfigMap cinema-infra-endpoints를 envFrom으로 받는다
#     (Python은 ${} 치환이 없어 여기 ${...}를 쓰지 않는다)
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: cinema-staging
resources:
  - ../../../base/ops-api
components:
  - ./image-tag
generatorOptions:
  annotations:
    argocd.argoproj.io/sync-wave: "-2"     # 다른 서비스와 같게 ConfigMap을 Deployment(0)보다 먼저
configMapGenerator:
  - name: ops-api-config
    literals:
      - APP_ENV=staging
      - AWS_REGION=ap-northeast-2
      - OPS_K8S_NAMESPACE=cinema-staging
      - OPS_STATE_CONFIGMAP=ops-api-state
      - OPS_SERVICES_AI_URL=http://ai:8080
      - OPS_SERVICES_COUPON_URL=http://coupon:8080
      - OPS_REPORT_DATABASE=cinema_staging_reports   # Glue 데이터베이스(6.1.8)
      - OPS_REPORT_TABLE=errors
