# payment staging 값. 이 레포는 Public → 계정 ID·엔드포인트·키를 쓰지 않는다 (gitops-validate가 막는다)
#   - 이미지 태그: ./image-tag (SeatSAC build-push가 newTag만 커밋. 사람이 직접 바꾸지 않는다, 롤백은 revert PR)
#   - 레지스트리 주소: ArgoCD Application(SeatSAC Terraform envs/staging-k8s/argocd_apps.tf)의 kustomize.images가 붙인다
#   - ${DB_HOST} 같은 값: Terraform ConfigMap cinema-infra-endpoints(envs/staging-k8s/infra_endpoints.tf)를
#     파드가 envFrom으로 같이 받고, Spring이 기동 때 치환한다 (쿠버네티스는 envFrom 값을 치환하지 않는다)
#   - Secret 값은 여기 두지 않는다 (payment-secrets·payment-migrator-secrets는 Terraform)
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: cinema-staging
resources:
  - ../../../base/payment
components:
  - ./image-tag                   # 태그만. 레지스트리는 ArgoCD가 이 overlay에 images(이름만)로 붙인다
generatorOptions:
  annotations:
    argocd.argoproj.io/sync-wave: "-2"     # Flyway Job(-1)보다 먼저
configMapGenerator:
  - name: payment-config
    literals:
      - SPRING_PROFILES_ACTIVE=staging
      - AWS_REGION=ap-northeast-2
      - SPRING_DATASOURCE_URL=jdbc:mysql://${DB_HOST}:3306/payment_db?connectionTimeZone=UTC&sslMode=VERIFY_IDENTITY&trustCertificateKeyStoreUrl=file:/truststore/rds-ca.p12&trustCertificateKeyStoreType=PKCS12&trustCertificateKeyStorePassword=rds-ca-truststore
      - SPRING_DATASOURCE_USERNAME=payment_app
      - SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE=5
      - SPRING_FLYWAY_ENABLED=false
      - APP_PAYMENT_MOCK_DELAY_CARD=9999
      - APP_PAYMENT_MOCK_DELAY=5s
      # 포트원 토스페이 (ADR-112, SeatSAC 런타임 계약 3장·런북 6-I). Secret(APP_PORTONE_API_SECRET·WEBHOOK_SECRET)이 들어간 뒤 켠다
      #   Store ID·채널 키는 공개 값이지만 이 레포가 Public이라 Terraform ConfigMap cinema-infra-endpoints에서 ${키}로 받는다
      - APP_PORTONE_ENABLED=true
      - APP_PORTONE_API_BASE_URL=https://api.portone.io
      - APP_PORTONE_STORE_ID=${PORTONE_STORE_ID}
      - APP_PORTONE_CHANNEL_KEY_TOSSPAY=${PORTONE_CHANNEL_KEY_TOSSPAY}
      - APP_PORTONE_PENDING_TIMEOUT=7m
